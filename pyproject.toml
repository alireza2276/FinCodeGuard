[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fincodeguard"
version = "0.1.0"
description = "A verification framework for AI-generated financial software."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Alireza Khatiri" }
]

dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

security = [
    "bandit>=1.7,<2.0",
    "semgrep>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["fincodeguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true